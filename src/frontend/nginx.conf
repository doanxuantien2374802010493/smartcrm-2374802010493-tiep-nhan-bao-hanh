server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Chuyển /api sang dịch vụ "api" trong mạng của compose (giao diện gọi đường dẫn tương đối /api)
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
